# Levanta todo con:  docker compose up --build
# Requiere .env con AUTH_SECRET (ver .env.example). La app queda en http://<ip-del-host>:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: centros_acopio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d centros_acopio"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Aplica migraciones y siembra datos de ejemplo (idempotente). Termina y deja paso a la app.
  migrate:
    build:
      context: .
      target: builder
    command: sh -c "npx prisma migrate deploy && npm run db:seed"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/centros_acopio?schema=public
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/centros_acopio?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?Define AUTH_SECRET en .env (min 32 chars)}
      # false = permite login por HTTP plano (demo en red local). Pon true detrás de HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
